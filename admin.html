<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - Tech Line</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6">
  <div class="max-w-5xl mx-auto">
    <h1 class="text-3xl font-bold text-cyan-400 mb-6">لوحة إدارة الطلبات - Tech Line</h1>
    <button onclick="fetchOrders()" class="bg-cyan-500 hover:bg-cyan-600 text-black font-bold px-4 py-2 rounded mb-6">تحديث الطلبات</button>
    
    <div id="orders-list" class="space-y-4">
      <p class="text-gray-400">جاري تحميل الطلبات...</p>
    </div>
  </div>

  <script>
    async function fetchOrders() {
      const container = document.getElementById('orders-list');
      container.innerHTML = '<p class="text-gray-400">جاري التحميل...</p>';
      try {
        const res = await fetch('/.netlify/functions/orders');
        const data = await res.json();
        
        if (!Array.isArray(data) || data.length === 0) {
          container.innerHTML = '<p class="text-gray-400">لا توجد طلبات حتى الآن.</p>';
          return;
        }

        container.innerHTML = data.map(order => `
          <div class="bg-gray-800 p-4 rounded-lg border border-gray-700">
            <div class="flex justify-between items-center mb-2">
              <span class="font-bold text-lg text-cyan-300">طلب #${order.id} - ${order.customer_name}</span>
              <span class="text-sm text-gray-400">${new Date(order.created_at).toLocaleString('ar')}</span>
            </div>
            <p><strong>رقم الهاتف:</strong> ${order.phone}</p>
            <p><strong>العنوان:</strong> ${order.address}</p>
            <p class="mt-2 font-bold text-green-400">الإجمالي: ${order.total_price} د.ل</p>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = '<p class="text-red-500">حدث خطأ أثناء جلب الطلبات.</p>';
      }
    }
    fetchOrders();
  </script>
</body>
</html>
