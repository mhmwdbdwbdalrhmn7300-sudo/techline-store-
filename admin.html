<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | Tech Line</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; background-color: #121212; color: #e0e0e0; }
    .card-bg { background-color: #1e1e1e; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">

  <div class="container mx-auto">
    <!-- الهيدر -->
    <div class="flex justify-between items-center mb-8 card-bg p-4 rounded-2xl border border-gray-800">
      <h1 class="text-2xl font-extrabold text-orange-500">لوحة تحكم الأدمن - Tech Line</h1>
      <a href="index.html" target="_blank" class="bg-zinc-800 hover:bg-zinc-700 text-white px-4 py-2 rounded-xl text-sm font-bold">عرض المتجر</a>
    </div>

    <!-- جدول الطلبات -->
    <div class="card-bg rounded-2xl border border-gray-800 p-4 overflow-x-auto shadow-xl">
      <h2 class="text-lg font-bold mb-4 text-gray-200">الطلبات الواردة (ليبيانا فقط)</h2>
      
      <table class="w-full text-right border-collapse text-sm">
        <thead>
          <tr class="border-b border-gray-800 text-gray-400">
            <th class="p-3">رقم الطلب</th>
            <th class="p-3">البيانات / المعرّف</th>
            <th class="p-3">الخدمة والمنتج</th>
            <th class="p-3">الهاتف والدفع</th>
            <th class="p-3">إدخال الكود الرقمي</th>
            <th class="p-3">الإجراء</th>
          </tr>
        </thead>
        <tbody id="orders-table-body">
          <tr><td colspan="6" class="text-center py-6 text-gray-400" id="loading">جاري تحميل الطلبات...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function fetchOrders() {
      try {
        const response = await fetch('/.netlify/functions/orders');
        const orders = await response.json();
        const tbody = document.getElementById('orders-table-body');
        tbody.innerHTML = '';

        if (!orders || orders.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-gray-500">لا توجد طلبات جديدة حالياً.</td></tr>`;
          return;
        }

        orders.reverse().forEach(order => {
          const cartItem = order.cart && order.cart[0] ? order.cart[0] : { game: 'غير محدد', offer: '', price: order.total_price };
          
          const tr = document.createElement('tr');
          tr.className = 'border-b border-gray-800/60 hover:bg-zinc-900/40';
          tr.innerHTML = `
            <td class="p-3 font-mono font-bold text-orange-400">#${order.id}</td>
            <td class="p-3 font-bold text-white">${order.customer_name}</td>
            <td class="p-3">
              <div class="text-orange-300 font-bold">${cartItem.game}</div>
              <div class="text-xs text-gray-400">${cartItem.offer} - <span class="text-orange-400">${cartItem.price} د.ل</span></div>
            </td>
            <td class="p-3">
              <div class="text-white font-mono">${order.phone}</div>
              <div class="text-xs text-gray-400">${order.address}</div>
            </td>
            <td class="p-3">
              <input type="text" id="code-${order.id}" value="${order.admin_code || ''}" placeholder="أدخل الكود هنا..." class="bg-zinc-900 border border-gray-700 text-white text-xs p-2 rounded-lg w-40 focus:outline-none focus:border-orange-500">
            </td>
            <td class="p-3 flex gap-2 items-center">
              <button onclick="saveCode('${order.id}')" class="bg-orange-600 hover:bg-orange-700 text-white text-xs px-3 py-2 rounded-lg font-bold transition-all">حفظ</button>
              <button onclick="deleteOrder('${order.id}')" class="bg-red-900/40 hover:bg-red-900 text-red-300 text-xs px-2.5 py-2 rounded-lg transition-all">حذف</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (error) {
        console.error('خطأ في جلب الطلبات:', error);
      }
    }

    async function saveCode(id) {
      const codeInput = document.getElementById(`code-${id}`).value;
      try {
        const response = await fetch(`/.netlify/functions/orders?id=${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ admin_code: codeInput })
        });
        if (response.ok) {
          alert('تم حفظ الكود بنجاح!');
          fetchOrders();
        } else {
          alert('فشل حفظ الكود');
        }
      } catch (error) {
        alert('خطأ في الاتصال');
      }
    }

    async function deleteOrder(id) {
      if (!confirm('هل أنت متأكد من حذف هذا الطلب؟')) return;
      try {
        const response = await fetch(`/.netlify/functions/orders?id=${id}`, {
          method: 'DELETE'
        });
        if (response.ok) {
          fetchOrders();
        } else {
          alert('فشل الحذف');
        }
      } catch (error) {
        alert('خطأ في الاتصال');
      }
    }

    fetchOrders();
    setInterval(fetchOrders, 10000);
  </script>
</body>
</html>
