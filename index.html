<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Line | تك لاين</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; background-color: #121212; color: #e0e0e0; }
    .accent-bg { background-color: #f97316; }
    .accent-bg:hover { background-color: #ea580c; }
    .accent-border { border-color: #f97316; }
    .card-bg { background-color: #1e1e1e; }
    .modal-bg { background-color: #1e1e1e; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- الهيدر -->
  <header class="card-bg border-b border-gray-800 p-4 sticky top-0 z-40">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-extrabold text-orange-500 tracking-wider">TECH LINE</h1>
      <a href="https://wa.me/218913147002" target="_blank" class="flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded-lg text-sm font-bold transition-all">
        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>
        <span>واتساب</span>
      </a>
    </div>
  </header>

  <!-- المحتوى الرئيسي -->
  <main class="container mx-auto px-4 py-8">
    <h2 class="text-xl font-bold mb-6 text-center text-gray-200">اختر الخدمة المطلوبة</h2>

    <!-- بطاقات الخدمات -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      
      <!-- فري فاير -->
      <div class="card-bg rounded-2xl p-6 border border-gray-800 hover:border-orange-500 transition-all shadow-lg flex flex-col justify-between">
        <div>
          <h3 class="text-xl font-extrabold text-orange-500 mb-2">فراي فاير (Free Fire)</h3>
          <p class="text-gray-400 text-sm mb-4">شحن جوهر فري فاير فورياً بالمعرّف (ID)</p>
          <div class="space-y-2 mb-6">
            <label class="block text-xs font-bold text-gray-300">اختر العرض:</label>
            <select id="ff-offers" class="w-full bg-zinc-900 border border-gray-700 rounded-lg p-3 text-sm focus:outline-none focus:border-orange-500">
              <option value="110 Diamonds" data-price="13.5">110 Diamonds - 13.5 دينار</option>
              <option value="210 Diamonds" data-price="26.264">210 Diamonds - 26.264 دينار</option>
              <option value="530 Diamonds" data-price="65.0">530 Diamonds - 65.0 دينار</option>
              <option value="1080 Diamonds" data-price="130.0">1080 Diamonds - 130.0 دينار</option>
            </select>
          </div>
        </div>
        <button onclick="openModal('فراي فاير (Free Fire)', 'ff-offers')" class="w-full accent-bg text-white font-bold py-3 rounded-xl transition-all shadow-md">طلب الآن</button>
      </div>

    </div>
  </main>

  <!-- Modal نافذة الطلب -->
  <div id="orderModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="modal-bg w-full max-w-md rounded-2xl p-6 border border-gray-800 shadow-2xl relative">
      
      <button onclick="closeModal()" class="absolute top-4 left-4 text-gray-400 hover:text-white font-bold text-lg">✕</button>
      
      <h3 id="modalTitle" class="text-lg font-bold text-orange-500 mb-4 text-center"></h3>

      <div class="space-y-4">
        <div class="bg-zinc-900 p-3 rounded-lg border border-gray-800 text-sm">
          <p><span class="text-gray-400">العرض:</span> <span id="modalOffer" class="font-bold text-white"></span></p>
          <p><span class="text-gray-400">السعر:</span> <span id="modalPrice" class="font-bold text-orange-400"></span> دينار</p>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-300 mb-1">معرّف الحساب (Player ID / Username):</label>
          <input type="text" id="player-id" placeholder="أدخل ID حسابك هنا" class="w-full bg-zinc-900 border border-gray-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-orange-500">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-300 mb-1">طريقة الدفع:</label>
          <select id="payment-method" onchange="updatePaymentDetails()" class="w-full bg-zinc-900 border border-gray-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-orange-500">
            <option value="تحويل رصيد">تحويل رصيد ليبيانا / مدار</option>
            <option value="كارت شحن ليبيانا">كارت شحن ليبيانا</option>
            <option value="كارت شحن مدار">كارت شحن مدار</option>
            <option value="سداد">خدمة سداد / تداول</option>
          </select>
        </div>

        <div id="payment-info-box" class="bg-orange-950/30 border border-orange-500/30 p-3 rounded-lg text-xs text-orange-300">
          <p class="font-bold mb-1">رقم التحويل: <span class="text-white select-all">0913147002</span></p>
          <p>قم بالتحويل إلى هذا الرقم ثم أدخل رقم هاتفك أدناه للتحقق.</p>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-300 mb-1">رقم الهاتف للتواصل:</label>
          <input type="tel" id="customer-phone" placeholder="09XXXXXXXX" class="w-full bg-zinc-900 border border-gray-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-orange-500">
        </div>

        <!-- أزرار الإجراءات -->
        <button onclick="submitOrder()" class="w-full accent-bg text-white font-bold py-3 rounded-xl transition-all shadow-md mt-2">تأكيد إرسال الطلب</button>
        
        <!-- زر الواتساب -->
        <a href="https://wa.me/218913147002" target="_blank" class="w-full flex items-center justify-center gap-2 bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl transition-all shadow-md">
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>
          <span>تواصل معنا عبر واتساب</span>
        </a>
      </div>
    </div>
  </div>

  <footer class="text-center p-4 text-xs text-gray-600 border-t border-gray-800">
    Tech Line Store &copy; 2026 - جميع الحقوق محفوظة
  </footer>

  <script>
    let selectedGame = '';
    let selectedOffer = '';
    let selectedPrice = 0;

    function openModal(gameName, selectId) {
      const select = document.getElementById(selectId);
      const selectedOption = select.options[select.selectedIndex];
      
      selectedGame = gameName;
      selectedOffer = selectedOption.value;
      selectedPrice = selectedOption.getAttribute('data-price');

      document.getElementById('modalTitle').innerText = `إتمام الطلب: ${gameName}`;
      document.getElementById('modalOffer').innerText = selectedOffer;
      document.getElementById('modalPrice').innerText = selectedPrice;
      
      document.getElementById('orderModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('orderModal').classList.add('hidden');
    }

    function updatePaymentDetails() {
      const method = document.getElementById('payment-method').value;
      const box = document.getElementById('payment-info-box');
      if (method.includes('كارت')) {
        box.innerHTML = `<p class="font-bold mb-1">إرسال كروت الشحن:</p><p>يرجى إرسال رقم كارت الشحن عبر الواتساب مباشرة مع رقم الطلب.</p>`;
      } else {
        box.innerHTML = `<p class="font-bold mb-1">رقم التحويل: <span class="text-white select-all">0913147002</span></p><p>قم بالتحويل إلى هذا الرقم ثم أدخل رقم هاتفك أدناه للتحقق.</p>`;
      }
    }

    async function submitOrder() {
      const phone = document.getElementById('customer-phone').value.trim();
      const playerId = document.getElementById('player-id').value.trim();
      const paymentMethod = document.getElementById('payment-method').value;

      if (!phone || !playerId) {
        alert('الرجاء تعبئة جميع الحقول المطلوبة (ID ورقم الهاتف)');
        return;
      }

      const orderData = {
        customer_name: `معرّف الحساب: ${playerId}`,
        phone: phone,
        address: `طريقة الدفع: ${paymentMethod}`,
        cart: [{ game: selectedGame, offer: selectedOffer, price: selectedPrice }],
        total_price: parseFloat(selectedPrice)
      };

      try {
        const response = await fetch('/.netlify/functions/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(orderData)
        });

        const result = await response.json();

        if (response.ok && result.success) {
          alert(`تم إرسال الطلب بنجاح! رقم الطلب: #${result.order.id}`);
          closeModal();
        } else {
          alert(`خطأ: ${result.error || 'فشل إرسال الطلب'}`);
        }
      } catch (error) {
        alert(`خطأ في الاتصال بالسيرفر: ${error.message}`);
      }
    }
  </script>
</body>
</html>
