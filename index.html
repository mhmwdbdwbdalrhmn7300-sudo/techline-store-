<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Line | تك لاين</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #121212; color: #FFFFFF; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto space-y-8">
        
        <!-- Header -->
        <header class="text-center space-y-2">
            <h1 class="text-4xl font-bold text-[#FF6B00]">Tech Line تك لاين</h1>
            <p class="text-gray-400">متجرك الأول لشحن الألعاب والتطبيقات عبر كروت ليبيانا</p>
        </header>

        <!-- Track Order Section -->
        <section class="bg-[#1E1E1E] p-6 rounded-[10px] border border-[#333] space-y-4">
            <h2 class="text-xl font-bold text-center">📦 تتبع طلبك واستلام الكود</h2>
            <p class="text-sm text-gray-400 text-center">أدخل رقم الطلب الخاص بك لمعرفة الحالة واستلام كود الشحن</p>
            <div class="flex flex-col md:flex-row gap-3">
                <input type="text" id="trackInput" placeholder="رقم الطلب (مثال: 1)" class="flex-1 p-3 rounded border border-[#444] bg-[#2A2A2A] text-white text-center focus:outline-none focus:border-[#FF6B00]">
                <button onclick="trackOrder()" class="bg-[#FF6B00] text-white px-6 py-3 rounded font-bold hover:opacity-90 transition-opacity">🔍 تتبع</button>
            </div>
        </section>

        <!-- Products Section -->
        <section class="space-y-4">
            <h2 class="text-2xl font-bold text-center">اختر الخدمة</h2>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4" id="productsGrid"></div>
        </section>

        <!-- Offers Section -->
        <section id="offersSection" class="hidden space-y-4">
            <h2 id="offersTitle" class="text-xl font-bold text-center text-[#FF6B00]"></h2>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4" id="offersGrid"></div>
        </section>

        <!-- Checkout Section -->
        <section id="checkoutSection" class="hidden bg-[#1E1E1E] p-6 rounded-[10px] border border-[#333] space-y-4">
            <h2 id="checkoutTitle" class="text-xl font-bold text-[#FF6B00]"></h2>
            
            <div id="offerSummary" class="bg-[#2A2A2A] p-4 rounded text-sm space-y-1 border border-[#444]"></div>

            <form id="orderForm" onsubmit="submitOrder(event)" class="space-y-4">
                <div>
                    <label class="block text-sm mb-1">معرّف الحساب (Player ID / Username):</label>
                    <input type="text" name="playerId" id="playerId" required class="w-full p-3 rounded border border-[#444] bg-[#2A2A2A] text-white focus:outline-none focus:border-[#FF6B00]">
                </div>

                <div>
                    <label class="block text-sm mb-1">طريقة الدفع:</label>
                    <select name="paymentMethod" id="paymentMethod" onchange="togglePaymentFields()" class="w-full p-3 rounded border border-[#444] bg-[#2A2A2A] text-white focus:outline-none focus:border-[#FF6B00]">
                        <option value="libyana">كارت شحن ليبيانا</option>
                        <option value="transfer">تحويل رصيد</option>
                    </select>
                </div>

                <div id="libyanaField">
                    <label class="block text-sm mb-1">رقم كارت الشحن (13 أو 14 رقم):</label>
                    <input type="text" name="cardCode" id="cardCode" required class="w-full p-3 rounded border border-[#444] bg-[#2A2A2A] text-white focus:outline-none focus:border-[#FF6B00]">
                </div>

                <div id="transferField" class="hidden bg-[#2A2A2A] p-4 rounded border border-[#444] text-sm space-y-2">
                    <p class="font-bold text-[#FF6B00]">رقم التحويل: 0944235295</p>
                    <p>قم بالتحويل إلى هذا الرقم ثم أدخل رقم هاتفك أدناه</p>
                </div>

                <div>
                    <label class="block text-sm mb-1">رقم الهاتف للتواصل:</label>
                    <input type="text" name="phoneNumber" id="phoneNumber" required class="w-full p-3 rounded border border-[#444] bg-[#2A2A2A] text-white focus:outline-none focus:border-[#FF6B00]">
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-[#FF6B00] text-white p-4 rounded font-bold hover:opacity-90 transition-opacity">تأكيد إرسال الطلب</button>
            </form>
        </section>

    </div>

    <script>
        const products = [
            { id: 'pubg', name: 'ببجي موبايل (PUBG)', displayName: 'PUBG Mobile', description: 'شدات بوبجي', offers: [ { name: '60 UC', price: '12.333' }, { name: '325 UC', price: '61.649' }, { name: '660 UC', price: '123.336' }, { name: '1800 UC', price: '308.339' }, { name: '3850 UC', price: '616.674' }, { name: '8100 UC', price: '1233.355' } ] },
            { id: 'freefire', name: 'فري فاير (Free Fire)', displayName: 'Free Fire', description: 'جواهر فري فاير', offers: [ { name: 'Diamonds 100', price: '13.132' }, { name: 'Diamonds 210', price: '26.264' }, { name: 'Diamonds 530', price: '65.660' }, { name: 'Diamonds 1080', price: '131.320' }, { name: 'Diamonds 2200', price: '262.640' } ] },
            { id: 'itunes-us', name: 'بطاقة آيتونز أمريكي', displayName: 'iTunes US', description: 'بطاقات متجر أمريكي', offers: [ { name: 'iTunes 2$', price: '26.264' }, { name: 'iTunes 3$', price: '39.396' }, { name: 'iTunes 4$', price: '52.528' }, { name: 'iTunes 5$', price: '65.660' }, { name: 'iTunes 10$', price: '131.320' }, { name: 'iTunes 15$', price: '196.980' }, { name: 'iTunes 20$', price: '262.640' }, { name: 'iTunes 25$', price: '328.300' } ] },
            { id: 'itunes-tr', name: 'بطاقة آيتونز تركي', displayName: 'iTunes TR', description: 'بطاقات متجر تركي', offers: [ { name: 'iTunes 25 TL', price: '8.554' }, { name: 'iTunes 50 TL', price: '17.107' }, { name: 'iTunes 100 TL', price: '34.215' }, { name: 'iTunes 250 TL', price: '85.538' }, { name: 'iTunes 1000 TL', price: '342.152' } ] },
            { id: 'tiktok', name: 'عملات تيك توك', displayName: 'TikTok Coins', description: 'عملات وهدايا تيك توك', offers: [] }
        ];

        let selectedProduct = null;
        let selectedOffer = null;

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = products.map(p => `
                <div onclick="selectProduct('${p.id}')" id="prod-${p.id}" class="bg-[#1E1E1E] rounded-[10px] p-4 text-center border border-[#333] hover:border-[#FF6B00] cursor-pointer transition-all">
                    <p class="font-bold">${p.displayName}</p>
                    <p class="text-xs text-gray-400 mt-1">${p.description}</p>
                </div>
            `).join('');
        }

        function selectProduct(id) {
            selectedProduct = products.find(p => p.id === id);
            selectedOffer = null;
            document.getElementById('checkoutSection').classList.add('hidden');

            document.querySelectorAll('#productsGrid > div').forEach(el => el.classList.remove('border-[#FF6B00]', 'bg-[#2A2A2A]'));
            document.getElementById(`prod-${id}`).classList.add('border-[#FF6B00]', 'bg-[#2A2A2A]');

            const offersSection = document.getElementById('offersSection');
            const offersTitle = document.getElementById('offersTitle');
            const offersGrid = document.getElementById('offersGrid');

            offersSection.classList.remove('hidden');
            
            if (selectedProduct.offers.length > 0) {
                offersTitle.innerText = `اختر العرض - ${selectedProduct.name}`;
                offersGrid.innerHTML = selectedProduct.offers.map((o, idx) => `
                    <div onclick="selectOffer(${idx})" id="off-${idx}" class="bg-[#1E1E1E] rounded-lg p-5 text-center border border-[#333] hover:border-[#FF6B00] cursor-pointer transition-all">
                        <p class="font-bold">${o.name}</p>
                        <p class="text-sm text-[#FF6B00] mt-1">${o.price} دينار</p>
                    </div>
                `).join('');
            } else {
                offersTitle.innerText = `العروض لـ ${selectedProduct.name} ستكون متاحة قريباً...`;
                offersGrid.innerHTML = '';
            }

            offersSection.scrollIntoView({ behavior: 'smooth' });
        }

        function selectOffer(index) {
            selectedOffer = selectedProduct.offers[index];

            document.querySelectorAll('#offersGrid > div').forEach(el => el.classList.remove('border-[#FF6B00]', 'bg-[#2A2A2A]'));
            document.getElementById(`off-${index}`).classList.add('border-[#FF6B00]', 'bg-[#2A2A2A]');

            const checkoutSection = document.getElementById('checkoutSection');
            document.getElementById('checkoutTitle').innerText = `إتمام الطلب: ${selectedProduct.name} - ${selectedOffer.name}`;
            document.getElementById('offerSummary').innerHTML = `
                <p><strong>العرض:</strong> ${selectedOffer.name}</p>
                <p><strong>السعر:</strong> ${selectedOffer.price} دينار</p>
            `;

            checkoutSection.classList.remove('hidden');
            checkoutSection.scrollIntoView({ behavior: 'smooth' });
        }

        function togglePaymentFields() {
            const method = document.getElementById('paymentMethod').value;
            const libyanaField = document.getElementById('libyanaField');
            const transferField = document.getElementById('transferField');
            const cardCodeInput = document.getElementById('cardCode');

            if (method === 'libyana') {
                libyanaField.classList.remove('hidden');
                transferField.classList.add('hidden');
                cardCodeInput.required = true;
            } else {
                libyanaField.classList.add('hidden');
                transferField.classList.remove('hidden');
                cardCodeInput.required = false;
            }
        }

        function trackOrder() {
            const id = document.getElementById('trackInput').value.trim();
            if (id) {
                alert(`جاري تتبع الطلب رقم: ${id}`);
            } else {
                alert('⚠️ الرجاء إدخال رقم الطلب');
            }
        }

        async function submitOrder(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = 'جاري الإرسال...';
            btn.disabled = true;

            const playerId = document.getElementById('playerId').value;
            const paymentMethod = document.getElementById('paymentMethod').value;
            const cardCode = document.getElementById('cardCode').value;
            const phoneNumber = document.getElementById('phoneNumber').value;

            const payload = {
                customer_name: `${selectedProduct ? selectedProduct.displayName : ''} - ID: ${playerId}`,
                phone: phoneNumber,
                address: `طريقة الدفع: ${paymentMethod} | الكارت/الرمز: ${cardCode || 'تحويل'}`,
                cart: [
                    {
                        product: selectedProduct ? selectedProduct.name : '',
                        offer: selectedOffer ? selectedOffer.name : '',
                        playerId: playerId,
                        paymentMethod: paymentMethod
                    }
                ],
                total_price: selectedOffer ? parseFloat(selectedOffer.price) : 0
            };

            try {
                const response = await fetch('/.netlify/functions/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.success) {
                    alert(`✅ تم إرسال الطلب بنجاح!\nرقم الطلب الخاص بك هو: #${result.order.id}`);
                    document.getElementById('orderForm').reset();
                    document.getElementById('checkoutSection').classList.add('hidden');
                    document.getElementById('offersSection').classList.add('hidden');
                } else {
                    alert('⚠️ حدث خطأ أثناء إرسال الطلب: ' + (result.error || 'حاول مرة أخرى'));
                }
            } catch (err) {
                console.error(err);
                alert('⚠️ تعذر الاتصال بالخادم، يرجى المحاولة لاحقاً.');
            } finally {
                btn.innerText = 'تأكيد إرسال الطلب';
                btn.disabled = false;
            }
        }

        renderProducts();
    </script>
</body>
</html>
